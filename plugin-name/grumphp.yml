grumphp:
    ignore_unstaged_changes: false
    tasks:
        composer:
            with_dependencies: false
            strict: false
        phpcs:
            standard: CodeatCodingStandard
            exclude: ['Squiz.PHP.CommentedOutCode', 'Generic.Commenting.Todo', 'SlevomatCodingStandard.Functions.UnusedParameter', 'SlevomatCodingStandard.Variables.UnusedVariable', 'Squiz.Commenting.FileComment', 'SlevomatCodingStandard.Whitespaces.DuplicateSpaces', 'SlevomatCodingStandard.TypeHints.DeclareStrictTypes', 'SlevomatCodingStandard.Files.TypeNameMatchesFileName', 'SlevomatCodingStandard.ControlStructures.RequireMultiLineTernaryOperator', 'Generic.CodeAnalysis.UnusedFunctionParameter']
            ignore_patterns: ['/vendor/', '/vendor-prefixed/', '/tests/', '/assets/build']
        phpmd:
            ruleset: ['phpmd.xml']
            exclude: ['/vendor/', '/tests/', '/assets/build']
        phpstan:
            configuration: phpstan.neon
            triggered_by: ['php']
            ignore_patterns: ['/vendor/']
        codeception:
            config_file: ~
            fail_fast: false
            suite: ~
            test: ~
        git_blacklist:
            keywords:
                - 'die('
                - 'print_r('
                - 'var_dump('
            triggered_by: ['php']
            ignore_patterns: ['plugin-name.php']
