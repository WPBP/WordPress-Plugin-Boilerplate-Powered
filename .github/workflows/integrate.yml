# https://docs.github.com/en/actions

name: "Integrate"

on:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"

env:
  PHP_EXTENSIONS: "mbstring, mysql"

jobs:
  coding-standards:
    name: "Coding Standards"

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"

        dependencies:
          - "highest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@2.37.1"
        with:
          coverage: "none"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          php-version: "${{ matrix.php-version }}"

      - name: "Validate composer.json"
        working-directory: "./plugin-name"
        run: "composer validate"

      - name: "Determine composer cache directory"
        working-directory: "./plugin-name"
        id: "determine-composer-cache-directory"
        run: '{ echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"; }'

      - name: "Install highest dependencies from composer.json"
        working-directory: "./plugin-name"
        run: "composer update --no-interaction --no-progress"

      - name: "Run ergebnis/composer-normalize"
        working-directory: "./plugin-name"
        run: "composer normalize --dry-run"

      - name: "Run squizlabs/PHP_CodeSniffer"
        working-directory: "./plugin-name"
        run: "vendor/bin/phpcs -s --standard=CodeatCodingStandard --exclude=Squiz.PHP.CommentedOutCode,Generic.Commenting.Todo,SlevomatCodingStandard.Functions.UnusedParameter,SlevomatCodingStandard.Variables.UnusedVariable,Squiz.Commenting.FileComment ."

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('plugin-name/composer.json') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      # - name: "Readme Validation"
     #  run: |
     #   curl -O https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar && chmod +x wp-cli.phar && mv wp-cli.phar /usr/local/bin/wp
     #   wp package install swissspidy/validate-readme-command:@stable --allow-root
     #   wp plugin validate-readme ./plugin-name/README.txt --allow-root

  static-code-analysis:
    name: "Static Code Analysis"

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"

        dependencies:
          - "highest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@2.37.1"
        with:
          coverage: "none"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          php-version: "${{ matrix.php-version }}"

      - name: "Determine composer cache directory"
        working-directory: "./plugin-name"
        id: "determine-composer-cache-directory"
        run: '{ echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"; }'

      - name: "Install highest dependencies from composer.json"
        working-directory: "./plugin-name"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --no-interaction --no-progress"

      - name: "Run phpstan/phpstan"
        working-directory: "./plugin-name"
        run: "vendor/bin/phpstan analyse"

      - name: "Cache dependencies installed with composer"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('plugin-name/composer.json') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

  node-build:
    name: "Build scripts"

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [ 16.x, 18.x, 20.x ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install NodeJS"
        uses: "actions/setup-node@v4"
        with:
          node-version: ${{ matrix.node-version }}

      - name: "install dependencies"
        working-directory: "./plugin-name"
        run: "npm install"

  editorconfig-adherence:
    name: "EditorConfig adherence"

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install NodeJS"
        uses: "actions/setup-node@v4"
        with:
          node-version: '16'

      - name: "install dependencies"
        working-directory: "./plugin-name"
        run: "npm install"

      - name: "Check EditorConfig adherence"
        working-directory: "./plugin-name"
        run: "npx prettier --check . !vendor !tests !assets/build"

  codeception-tests:
    name: "Codeception tests (wp-env)"
    timeout-minutes: 20

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        # PHP 8.0 single-version for Codeception CI compatibility
        php-version:
          - "8.0"

        dependencies:
          - "highest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@2.37.1"
        with:
          coverage: "none"
          extensions: "${{ env.PHP_EXTENSIONS }}, intl"
          php-version: "${{ matrix.php-version }}"

      - name: "Install Node.js"
        uses: "actions/setup-node@v4"
        with:
          node-version: '20'

      - name: "Determine composer cache directory"
        working-directory: "./plugin-name"
        id: "determine-composer-cache-directory"
        run: '{ echo "directory=$(composer config cache-dir)" >> "$GITHUB_OUTPUT"; }'

      - name: "Install highest dependencies from composer.json"
        working-directory: "./plugin-name"
        if: "matrix.dependencies == 'highest'"
        run: "composer update --no-interaction --no-progress"

      - name: "Cache composer dependencies"
        uses: "actions/cache@v4"
        with:
          path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
          key: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-${{ hashFiles('plugin-name/composer.json') }}"
          restore-keys: "php-${{ matrix.php-version }}-composer-${{ matrix.dependencies }}-"

      - name: "Install npm dependencies"
        working-directory: "./plugin-name"
        run: "npm install"

      - name: "Cache npm dependencies"
        uses: "actions/cache@v4"
        with:
          path: "~/.npm"
          key: "node-20-npm-${{ hashFiles('plugin-name/package-lock.json') }}"
          restore-keys: "node-20-npm-"

      - name: "Start wp-env"
        working-directory: "./plugin-name"
        run: "npx --yes @wordpress/env start"

      - name: "Wait for wp-env to be ready"
        run: |
          timeout 120 bash -c '
            while ! docker ps | grep -q "wordpress-test"; do
              echo "Waiting for wp-env containers..."
              sleep 5
            done
          ' || echo "wp-env containers started"

      - name: "Set Codeception parameters for wp-env"
        working-directory: "./plugin-name"
        run: |
          rm tests/_envs/.env 2>/dev/null || true
          cat > tests/_envs/.env << EOF
          WP_ROOT=/var/www/html
          WP_URL='http://localhost:8889'
          WP_DOMAIN='example.test'
          DB_HOST='mysql'
          DB_NAME='wordpress_unit_tests'
          TEST_DB_NAME='wordpress_unit_tests'
          DB_USER='root'
          DB_PASSWORD='root'
          EOF

      - name: "Run codeception wpunit via wp-env"
        working-directory: "./plugin-name"
        run: |
          npx --yes @wordpress/env run tests-wordpress -- --env-cwd=wp-content/plugins/plugin-name php -d register_argc_argv=On vendor/bin/codecept run wpunit

      - name: "Stop wp-env"
        working-directory: "./plugin-name"
        if: always()
        run: "npx --yes @wordpress/env stop"

  plugin-check:
    name: "Plugin Check"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Install PHP with extensions"
        uses: "shivammathur/setup-php@2.37.1"
        with:
          coverage: "none"
          extensions: "${{ env.PHP_EXTENSIONS }}"
          php-version: "8.0"

      # Known upstream issue (2026): action may fail on ubuntu-24.04 runner images; if the first CI run fails, pin to ubuntu-22.04
      - name: "Run WordPress Plugin Check"
        uses: "wordpress/plugin-check-action@v1"
        with:
          build-dir: "./plugin-name"
